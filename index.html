<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món Quà 20/11 Tri Ân Bí Mật 🎁</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffe6fa 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(216, 27, 96, 0.15);
            max-width: 480px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 999;
            border: 1px solid rgba(255, 182, 193, 0.5);
        }

        h2 {
            color: #d81b60;
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: 700;
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .input-group {
            margin: 20px 0;
        }

        input[type="number"] {
            padding: 14px;
            font-size: 18px;
            width: 85%;
            text-align: center;
            border: 2px solid #ff4081;
            border-radius: 12px;
            outline: none;
            transition: 0.3s;
            background: #fffafa;
            color: #333;
        }

        input:focus {
            border-color: #d81b60;
            box-shadow: 0 0 12px rgba(255, 64, 129, 0.3);
            background: #fff;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
            margin-top: 15px;
        }

        button {
            background: linear-gradient(135deg, #ff4081 0%, #d81b60 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(216, 27, 96, 0.4);
            filter: brightness(1.05);
        }

        .quiz-option-btn {
            background: #fff0f5;
            color: #d81b60;
            border: 2px solid #ff4081;
            text-align: left;
            padding: 14px 18px;
            font-weight: 500;
        }

        .quiz-option-btn:hover {
            background: #ff4081;
            color: white;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        .gift-box {
            background: linear-gradient(145deg, #fff0f5 0%, #ffe4ec 100%);
            padding: 24px;
            border-radius: 18px;
            border: 2px dashed #ff4081;
            margin-top: 15px;
            box-shadow: inset 0 2px 8px rgba(255, 192, 203, 0.5);
        }

        .gift-box img {
            max-width: 100%;
            height: auto;
            border-radius: 14px;
            margin-top: 15px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .gift-box img:hover {
            transform: scale(1.02);
        }

        .comment-text {
            color: #ff1744;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .progress-text {
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Nút bật/tắt nhạc nổi */
        #musicBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #ff4081;
            color: #d81b60;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        #musicBtn:hover {
            transform: scale(1.1);
            background: #fff;
        }

        /* Hiệu ứng hoa rơi */
        .snowflake {
            position: fixed;
            top: -20px;
            z-index: 998;
            user-select: none;
            cursor: default;
            animation-name: fall, shake;
            animation-duration: 10s, 3s;
            animation-timing-function: linear, ease-in-out;
            animation-iteration-count: infinite, infinite;
        }

        @keyframes fall {
            0% { top: -20px; }
            100% { top: 105vh; }
        }

        @keyframes shake {
            0% { transform: translateX(0px); }
            50% { transform: translateX(60px); }
            100% { transform: translateX(0px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>

            39: { name: "Lý Hữu Triệu Vinh", dob: "06/10/2009", wish: "Chúc Triệu Vinh luôn phong độ, bản lĩnh, gặt hái thật nhiều điểm 10 vinh quang!", img: "https://images.unsplash.com/photo-1532012197267-da84d127e765?w=400" },
            40: { name: "Nguyễn Ngọc Tường Vy", dob: "30/01/2009", wish: "Chúc Tường Vy luôn xinh xắn, học giỏi và có một mùa 20/11 ngập tràn kỷ niệm đẹp!", img: "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=400" },
            41: { name: "Trần Như Ý", dob: "22/03/2009", wish: "Chúc Như Ý vạn sự như ý, luôn mỉm cười hạnh phúc và đạt thành công rực rỡ!", img: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=400" }
        };

        // =========================================================
        // BỘ 5 CÂU HỎI TRẮC NGHIỆM VỀ 20/11
        // =========================================================
        const questions = [
            {
                q: "1. Ngày 20/11 hàng năm ở Việt Nam là ngày gì?",
                options: [
                    "A. Ngày Nhà giáo Việt Nam 💐",
                    "B. Ngày Quốc tế Phụ nữ",
                    "C. Ngày Học sinh Sinh viên"
                ],
                correctAnswer: 0
            },
            {
                q: "2. Loài hoa nào thường được dùng phổ biến nhất để tri ân thầy cô ngày 20/11?",
                options: [
                    "A. Hoa Hồng 🌹",
                    "B. Hoa Hướng Dương 🌻",
                    "C. Cả hai loài hoa trên 🥰"
                ],
                correctAnswer: 2
            },
            {
                q: "3. Hình ảnh nào thường được ví với công ơn dạy dỗ của thầy cô?",
                options: [
                    "A. Người lái đò đưa khách qua sông 🚣‍♂️",
                    "B. Ngọn nón che mưa nắng",
                    "C. Cây đại thụ tỏa bóng mát"
                ],
                correctAnswer: 0
            },
            {
                q: "4. Điều gì khiến các thầy cô hạnh phúc nhất trong ngày 20/11?",
                options: [
                    "A. Sự trưởng thành và nụ cười của học trò 🎓",
                    "B. Món quà đắt tiền",
                    "C. Được nghỉ học cả tuần"
                ],
                correctAnswer: 0
            },
            {
                q: "5. Bạn đã sẵn sàng mở món quà bí mật 20/11 chưa?",
                options: [
                    "A. Sẵn sàng rồi, mở quà thôi! 🎁",
                    "B. Chưa sẵn sàng lắm",
                    "C. Từ từ đã"
                ],
                correctAnswer: 0
            }
        ];

        let selectedNumber = null;
        let currentQuestionIndex = 0;

        // Xử lý Bước 1
        function goToStep2() {
            const num = document.getElementById('numInput').value;
            if (!num || num < 1 || num > 41) {
                alert("Vui lòng nhập số thứ tự hợp lệ từ 1 đến 41 nhé!");
                return;
            }
            selectedNumber = num;
            playMusic();
            showStep('step2');
        }

        // Xử lý Bước 2
        function answerDay(choice) {
            const commentElement = document.getElementById('commentDay');
            if (choice === '20-11') {
                commentElement.innerText = "Chính xác tuyệt đối! 👏";
            } else {
                commentElement.innerText = "Bật mí nhỏ: Hôm nay chính là dịp 20/11 đấy nha! 😜";
            }

            const person = data[selectedNumber];
            if (person) {
                document.getElementById('personName').innerText = person.name;
                document.getElementById('personDob').innerText = `📅 Ngày sinh: ${person.dob}`;
            } else {
                document.getElementById('personName').innerText = "Học sinh số " + selectedNumber;
                document.getElementById('personDob').innerText = "";
            }
            
            showStep('step3');
        }

        // Bắt đầu phần trả lời 5 câu hỏi
        function startQuiz() {
            currentQuestionIndex = 0;
            document.getElementById('quizFeedback').innerText = "";
            showQuestion();
            showStep('stepQuiz');
        }

        // Hiển thị nội dung từng câu hỏi
        function showQuestion() {
            const qData = questions[currentQuestionIndex];
            document.getElementById('quizProgress').innerText = `Câu hỏi ${currentQuestionIndex + 1} / ${questions.length}`;
            document.getElementById('quizQuestion').innerText = qData.q;
            document.getElementById('quizFeedback').innerText = ""; 

            const optionsContainer = document.getElementById('quizOptions');
            optionsContainer.innerHTML = '';

            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });
        }

        // Kiểm tra đúng / sai
        function checkAnswer(selectedIndex) {
            const qData = questions[currentQuestionIndex];
            const feedbackElement = document.getElementById('quizFeedback');

            if (selectedIndex === qData.correctAnswer) {
                feedbackElement.style.color = "#2e7d32"; 
                feedbackElement.innerText = "Chính xác! 🎉 Đang chuyển câu tiếp theo...";
                
                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < questions.length) {
                        showQuestion();
                    } else {
                        goToFinalStep();
                    }
                }, 800); 
            } else {
                feedbackElement.style.color = "#d32f2f"; 
                feedbackElement.innerText = "Chưa chính xác rồi, thử chọn đáp án khác xem nào! ❌";
            }
        }

        // Xử lý Hiện Quà Cuối Cùng
        function goToFinalStep() {
            const person = data[selectedNumber];
            const wishElement = document.getElementById('finalWish');
            const imgElement = document.getElementById('finalImg');

            if (person) {
                wishElement.innerText = person.wish;
                imgElement.src = person.img;
            } else {
                wishElement.innerText = "Chúc bạn có một ngày 20/11 thật vui vẻ, ngập tràn may mắn và đạt nhiều thành tích tốt!";
                imgElement.src = "https://images.unsplash.com/photo-1526047932273-341f2a7631f9?w=400";
            }

            showStep('stepFinal');
        }

        // Hàm chuyển đổi các bước
        function showStep(stepId) {
            document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
        }

        // Bộ điều khiển nhạc
        function playMusic() {
            const music = document.getElementById('bgMusic');
            music.play().catch(error => {
                console.log("Trình duyệt chặn nhạc tự động: ", error);
            });
        }

        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const btn = document.getElementById('musicBtn');
            if (music.paused) {
                music.play();
                btn.innerText = "🎵";
            } else {
                music.pause();
                btn.innerText = "🔇";
            }
        }

        // Hiệu ứng hoa rơi tự động
        function createFlower() {
            const flower = document.createElement('div');
            flower.classList.add('snowflake');
            flower.innerHTML = ['🌸', '🌹', '🌷', '✨', '💖', '💐'][Math.floor(Math.random() * 6)];
            flower.style.left = Math.random() * window.innerWidth + 'px';
            flower.style.fontSize = (Math.random() * 15 + 16) + 'px';
            
            const duration = Math.random() * 5 + 5;
            flower.style.animationDuration = `${duration}s, 3s`;
            
            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, duration * 1000);
        }

        setInterval(createFlower, 280);
    </script>

</body>
