<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NAMDEX - Galaxy Love</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
  }
  #container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #1a0012, #000);
  }
  #container canvas {
    display: block;
    touch-action: none;
  }
  #rotate-warning {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 14px;
    display: none;
    text-align: center;
    color: #ffd6f0;
    font-size: 14px;
    text-shadow: 0 0 8px #ff69b4;
    pointer-events: none;
    z-index: 10;
  }
  body.portrait-mode #rotate-warning { display: block; }
  body.intro-started #rotate-warning { opacity: 0.6; }

  /* Nút "Chạm vào màn hình" */
  #tap-btn, #wish-btn {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh);
    transform: translateX(-50%) translateY(12px);
    padding: 13px 28px;
    border-radius: 999px;
    border: 1px solid rgba(255, 200, 220, 0.6);
    background: rgba(255, 90, 150, 0.18);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: #fff;
    font: 400 17px/1 'Pacifico', 'Be Vietnam Pro', Arial, sans-serif;
    letter-spacing: 0.04em;
    text-shadow: 0 0 10px #ff69b4;
    box-shadow: 0 0 18px rgba(255, 105, 180, 0.45), inset 0 0 14px rgba(255, 160, 220, 0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease, transform 0.9s ease;
    z-index: 20;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #tap-btn.show, #wish-btn.show {
    opacity: 1;
    pointer-events: auto;
    animation: tapPulse 1.9s ease-in-out infinite;
  }
  /* Hộp viết điều ước */
  #wish-panel {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -46%) scale(0.96);
    width: min(88vw, 380px); box-sizing: border-box;
    padding: 18px 18px 16px; border-radius: 22px;
    border: 1px solid rgba(255, 200, 220, 0.5);
    background: rgba(40, 8, 30, 0.72);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 0 40px rgba(255, 105, 180, 0.35);
    color: #fff; text-align: center;
    font-family: 'Be Vietnam Pro', Arial, sans-serif;
    opacity: 0; pointer-events: none;
    transition: opacity 0.45s ease, transform 0.45s ease;
    z-index: 30;
  }
  #wish-panel.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  #wish-panel h3 {
    margin: 0 0 12px; font: 400 20px 'Pacifico', 'Be Vietnam Pro', sans-serif;
    text-shadow: 0 0 12px #ff69b4;
  }
  #wish-input {
    width: 100%; box-sizing: border-box; min-height: 84px; resize: none;
    padding: 12px; border-radius: 14px;
    border: 1px solid rgba(255, 200, 220, 0.45);
    background: rgba(255, 255, 255, 0.08); color: #fff;
    font: 500 15px/1.4 'Be Vietnam Pro', Arial, sans-serif; outline: none;
    -webkit-user-select: text; user-select: text;
  }
  #wish-input::placeholder { color: rgba(255, 220, 235, 0.55); }
  .wish-actions { display: flex; gap: 10px; margin-top: 12px; }
  .wish-actions button {
    flex: 1; padding: 11px 0; border-radius: 999px;
    border: 1px solid rgba(255, 200, 220, 0.55);
    background: rgba(255, 90, 150, 0.2); color: #fff;
    font: 600 14px 'Be Vietnam Pro', Arial, sans-serif; cursor: pointer;
  }
  #wish-send { background: rgba(255, 90, 150, 0.55) !important; box-shadow: 0 0 16px rgba(255, 105, 180, 0.5); }

  /* ===== Thư điện ảnh ===== */
  #letter-icon {
    position: fixed; right: max(16px, env(safe-area-inset-right));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh);
    width: 58px; height: 58px; border-radius: 50%;
    border: 1px solid rgba(255, 200, 220, 0.65);
    background: rgba(255, 90, 150, 0.22);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    font-size: 26px; line-height: 58px; text-align: center; padding: 0; color: #fff;
    box-shadow: 0 0 20px rgba(255, 105, 180, 0.55), inset 0 0 14px rgba(255, 160, 220, 0.25);
    opacity: 0; transform: scale(0.5); pointer-events: none;
    transition: opacity 1s ease, transform 1s cubic-bezier(.2,.9,.3,1.3);
    z-index: 20; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #letter-icon.show { opacity: 1; transform: scale(1); pointer-events: auto; animation: iconFloat 2.8s ease-in-out infinite; }
  #letter-icon::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(255, 190, 220, 0.8); animation: iconPing 2.2s ease-out infinite;
  }
  @keyframes iconFloat { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-7px) scale(1.07); } }
  @keyframes iconPing { 0% { transform: scale(1); opacity: .75; } 100% { transform: scale(2); opacity: 0; } }

  #letter-stage {
    position: fixed; inset: 0; z-index: 100; overflow: hidden;
    opacity: 0; pointer-events: none; transition: opacity 1s ease;
  }
  #letter-stage.on { opacity: 1; pointer-events: auto; }
  #letter-stage .veil {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 55%, rgba(110, 14, 66, 0.5), rgba(8, 0, 8, 0.9) 72%);
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
  }
  #letter-fx { position: absolute; inset: 0; width: 100%; height: 100%; }
  #letter-stage .bar {
    position: absolute; left: 0; right: 0; height: 0; background: #000; z-index: 6;
    transition: height 1.4s cubic-bezier(.2,.7,.2,1);
  }
  #letter-stage .bar.top { top: 0; } #letter-stage .bar.bot { bottom: 0; }
  #letter-stage.on .bar { height: 8vh; }
  #letter-x {
    position: absolute; z-index: 7; right: 14px; top: calc(8vh + 10px);
    width: 38px; height: 38px; border-radius: 50%; padding: 0;
    border: 1px solid rgba(255, 200, 220, 0.5); background: rgba(255, 90, 150, 0.2);
    color: #fff; font-size: 16px; cursor: pointer; opacity: 0; transition: opacity 1s ease 1.5s;
  }
  #letter-stage.on #letter-x { opacity: 0.85; }

  /* phong bì 3D */
  #env {
    position: absolute; left: 50%; top: 50%; z-index: 3;
    width: min(80vw, 340px); aspect-ratio: 1.5;
    transform: translate(-50%, 45vh) scale(0.8); opacity: 0;
    perspective: 1000px;
    transition: transform 1.7s cubic-bezier(.16,.8,.2,1), opacity 1.1s ease;
  }
  #env.rise { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  #env.away { transform: translate(-50%, 30vh) scale(0.85); opacity: 0; transition: transform 1.3s ease-in, opacity 1s ease; }
  #env > div { position: absolute; }
  .env-back { inset: 0; border-radius: 10px; background: linear-gradient(160deg, #c2417f, #86205c);
    box-shadow: 0 0 70px rgba(255, 90, 170, 0.5), 0 24px 60px rgba(0,0,0,.55); }
  .env-paper { left: 7%; right: 7%; top: 9%; bottom: 9%; border-radius: 6px; z-index: 2;
    background: linear-gradient(#fff, #ffe3ef); box-shadow: 0 0 24px rgba(255,170,210,.7);
    transition: transform 1.3s cubic-bezier(.3,.7,.2,1) .55s; }
  .env-paper::before { content: ''; position: absolute; left: 14%; right: 14%; top: 20%; height: 2px;
    background: rgba(194,39,95,.25); box-shadow: 0 10px 0 rgba(194,39,95,.2), 0 20px 0 rgba(194,39,95,.15); }
  #env.open .env-paper { transform: translateY(-56%); }
  .env-front { inset: 0; z-index: 3; border-radius: 10px;
    background: linear-gradient(160deg, #e0558f, #a52b72);
    clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%); }
  .env-flap { inset: 0; z-index: 4; transform-origin: 50% 0; border-radius: 10px;
    background: linear-gradient(180deg, #f372aa, #c2417f);
    clip-path: polygon(0 0, 100% 0, 50% 56%);
    transition: transform 1.1s cubic-bezier(.4,.1,.2,1); }
  #env.open .env-flap { transform: rotateX(178deg); }
  #env.flap-back .env-flap { z-index: 1; }
  .env-seal { left: 50%; top: 50%; z-index: 5; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%; display: grid; place-items: center; font-size: 22px; color: #ffd6e8;
    background: radial-gradient(circle at 35% 30%, #ff6f9f, #b3123f 70%);
    box-shadow: 0 0 22px rgba(255, 80, 140, .8), inset 0 -3px 6px rgba(0,0,0,.3);
    animation: sealBeat 1.1s ease-in-out infinite; transition: opacity .5s ease; }
  #env.open .env-seal { opacity: 0; animation: none; }
  @keyframes sealBeat { 0%,100% { transform: scale(1); } 40% { transform: scale(1.18); } 60% { transform: scale(1.04); } }

  /* tờ thư */
  #letter-paper {
    position: absolute; left: 50%; top: 50%; z-index: 4;
    width: min(88vw, 430px); max-height: 66vh; box-sizing: border-box;
    padding: 30px 26px 24px; border-radius: 14px; overflow-y: auto;
    background: radial-gradient(circle at 20% 10%, #fffafc, #ffe9f2 55%, #ffd9ea);
    color: #6b2250; text-align: left;
    box-shadow: 0 0 90px rgba(255, 120, 190, 0.6), 0 30px 80px rgba(0,0,0,.6), inset 0 0 44px rgba(255, 160, 200, 0.35);
    transform: translate(-50%, -40%) scale(0.55); opacity: 0; pointer-events: none;
    transition: transform 1.5s cubic-bezier(.16,.85,.2,1), opacity 1.1s ease;
    touch-action: pan-y; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  #letter-paper::-webkit-scrollbar { display: none; }
  #letter-paper.show { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
  .lt-title { text-align: center; font: 400 27px 'Pacifico', cursive; color: #c2275f;
    text-shadow: 0 0 14px rgba(255, 105, 180, .45); margin-bottom: 4px; }
  .lt-orn { text-align: center; color: #e0558f; letter-spacing: .5em; font-size: 12px; margin-bottom: 14px; opacity: .8; }
  .lt-p { font: 700 22px/1.55 'Dancing Script', 'Be Vietnam Pro', cursive; margin: 0; }
  .lt-gap { height: 12px; }
  .lt-sign { text-align: right; font: 400 21px/1.5 'Pacifico', cursive; color: #c2275f; margin-top: 4px; }
  .lt-w { display: inline-block; opacity: 0; filter: blur(7px); transform: translateY(8px);
    transition: opacity .9s ease, filter .9s ease, transform .9s ease; }
  .lt-w.in { opacity: 1; filter: blur(0); transform: none; }
  #letter-done {
    display: block; margin: 18px auto 0; padding: 11px 30px; border-radius: 999px;
    border: 1px solid rgba(194, 39, 95, .4); background: rgba(255, 90, 150, .18); color: #a21b55;
    font: 400 15px 'Pacifico', cursive; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 1.2s ease;
  }
  #letter-done.in { opacity: 1; pointer-events: auto; }

  /* ===== Ảnh bay lên liên tục ===== */
  #photo-rise { position: fixed; inset: 0; z-index: 8; pointer-events: none; overflow: hidden; }
  .pr-card {
    position: absolute; top: 100%; box-sizing: border-box; padding: 0; border-radius: 18px;
    opacity: 0; will-change: transform, opacity;
    animation: prRise var(--dur) linear forwards;
  }
  .pr-card img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 18px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 62%, rgba(0,0,0,0) 100%);
    mask-image: radial-gradient(ellipse at center, #000 62%, rgba(0,0,0,0) 100%); }
  .pr-card::after {   /* ánh sáng lướt qua mặt ảnh */
    content: ''; position: absolute; inset: 10%; border-radius: 14px; pointer-events: none;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.35) 50%, transparent 65%);
    background-size: 250% 100%; animation: prShine 4.5s ease-in-out infinite; animation-delay: var(--sd);
  }
  .pr-card .pr-heart { position: absolute; right: -6px; bottom: -8px; font-size: 18px; color: #ff8fc8;
    text-shadow: 0 0 10px #ff69b4; animation: prBeat 1.4s ease-in-out infinite; }
  .pr-fallback { width: 100%; height: 100%; border-radius: 12px; display: grid; place-items: center;
    font-size: 34px; color: #ffd6ec; text-shadow: 0 0 16px #ff69b4;
    background: radial-gradient(circle at 30% 25%, #ff9ccd, #b02a72 75%); }
  @keyframes prRise {
    0%   { transform: translate3d(0, 0, 0) rotate(var(--r0)) scale(var(--sc)); opacity: 0; }
    10%  { opacity: var(--op); }
    50%  { transform: translate3d(var(--sw), -62vh, 0) rotate(var(--r1)) scale(var(--sc)); }
    90%  { opacity: var(--op); }
    100% { transform: translate3d(calc(var(--sw) * -0.6), -130vh, 0) rotate(var(--r0)) scale(var(--sc)); opacity: 0; }
  }
  @keyframes prShine { 0% { background-position: 150% 0; } 60%,100% { background-position: -50% 0; } }
  @keyframes prBeat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
  @keyframes tapPulse {
    0%, 100% { transform: translateX(-50%) translateY(0) scale(1); box-shadow: 0 0 16px rgba(255,105,180,.4), inset 0 0 14px rgba(255,160,220,.2); }
    50%      { transform: translateX(-50%) translateY(0) scale(1.06); box-shadow: 0 0 30px rgba(255,105,180,.75), inset 0 0 18px rgba(255,160,220,.35); }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="container"></div>
<div id="rotate-warning">📱 Xoay ngang điện thoại để xem đẹp hơn</div>
<button id="tap-btn" type="button">♡ Chạm vào màn hình ♡</button>
<button id="wish-btn" type="button">🌠 Gửi điều ước</button>
<div id="photo-rise"></div>
<button id="letter-icon" type="button" aria-label="Mở thư">💌</button>
<div id="letter-stage">
  <div class="veil"></div>
  <canvas id="letter-fx"></canvas>
  <div class="bar top"></div><div class="bar bot"></div>
  <button id="letter-x" type="button" aria-label="Đóng">✕</button>
  <div id="env">
    <div class="env-back"></div>
    <div class="env-paper"></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="env-seal">♥</div>
  </div>
  <div id="letter-paper"></div>
</div>
<div id="wish-panel">
  <h3>Gửi điều ước lên sao băng</h3>
  <textarea id="wish-input" maxlength="90" placeholder="Viết lời chúc của bạn..."></textarea>
  <div class="wish-actions">
    <button id="wish-close" type="button">Đóng</button>
    <button id="wish-send" type="button">Bay lên ✦</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// =====================================================================
// ---- CẤU HÌNH: CHỈNH SỬA Ở ĐÂY ----
// =====================================================================
const CONFIG = {
  // Các dòng chữ quay quanh hành tinh
  ringTexts: [
    'XIN LỖI VÌ NHỮNG LẦN LÀM EM BUỒN',
    'THƯƠNG MỖI EM NGUYÊN',
    'CHÚC MỪNG 20/10',
    'NAMDEX'
  ],
  // Ảnh của bạn
  images: [
    'https://raw.githubusercontent.com/namdexVND/VNDhinhanh/refs/heads/main/004f2e204a0aa6c5c7c9c6c8ffea082d.jpg',
    'https://raw.githubusercontent.com/namdexVND/VNDhinhanh/refs/heads/main/bdddc4d3081f70a27b8387757cbb4523.jpg',
    'https://raw.githubusercontent.com/namdexVND/VNDhinhanh/refs/heads/main/images%20(12).jpeg',
    'https://raw.githubusercontent.com/namdexVND/VNDhinhanh/refs/heads/main/images%20(14).jpeg',
    'https://raw.githubusercontent.com/namdexVND/VNDhinhanh/refs/heads/main/images%20(15).jpeg'
  ],
  music: '',
  hintText: 'Chạm Vào Tinh Cầu',

  texts: {
    name2: 'Nguyễn Trọng Nam',
    love: 'Anh yêu em',
    lover: 'Nguyễn Đặng Vinh Hoa'
  },
  letter: {
    title: 'Chúc mừng 20/10 ♡',
    text: 'Gửi em,\n\nHôm nay là 20/10, anh muốn nói với em rằng em là điều đẹp nhất trong thiên hà nhỏ của anh.\n\nXin lỗi vì những lần làm em buồn. Anh sẽ cố gắng mỗi ngày để em được cười nhiều hơn.\n\nChúc em luôn xinh đẹp, bình an và hạnh phúc. Anh yêu em.\n\n— Nam'
  },
  holdAfterName2: 5,
  nameDelay: 10
};

const EXTRA = (window.dataCCD && window.dataCCD.data) || {};
const ringTexts = [...CONFIG.ringTexts, ...(EXTRA.ringTexts || [])];
let heartImages = [...(EXTRA.heartImages || []), ...CONFIG.images];
if (heartImages.length === 0) heartImages = Array(9).fill(null);

// =====================================================================
// ---- SCENE, CAMERA, RENDERER ----
// =====================================================================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.0015);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100000);
camera.position.set(0, 20, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('container').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.enabled = false;
controls.target.set(0, 0, 0);
controls.enablePan = false;
controls.minDistance = 15;
controls.maxDistance = 300;
controls.zoomSpeed = 0.3;
controls.rotateSpeed = 0.3;
controls.update();

const maxAniso = renderer.capabilities.getMaxAnisotropy();

let introStarted = false;
let fadeOpacity = 0.1;

// =====================================================================
// ---- GLOW, TINH VÂN ----
// =====================================================================
function createGlowSprite(color, size = 128, opacity = 0.55) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const context = canvas.getContext('2d');
  const gradient = context.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gradient.addColorStop(0, color);
  gradient.addColorStop(1, 'rgba(0,0,0,0)');
  context.fillStyle = gradient;
  context.fillRect(0, 0, size, size);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const material = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    opacity,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  return new THREE.Sprite(material);
}

const centralGlow = createGlowSprite('rgba(255,255,255,0.8)', 156, 0.25);
centralGlow.scale.set(8, 8, 1);
scene.add(centralGlow);

const nebulae = [];
for (let i = 0; i < 15; i++) {
  const hue = Math.random() * 360;
  const nebula = createGlowSprite(`hsla(${hue}, 80%, 50%, 0.6)`, 256);
  nebula.scale.set(100, 100, 1);
  nebula.position.set(
    (Math.random() - 0.5) * 175,
    (Math.random() - 0.5) * 175,
    (Math.random() - 0.5) * 175
  );
  scene.add(nebula);
  nebulae.push(nebula);
}

// =====================================================================
// ---- THIÊN HÀ ----
// =====================================================================
const galaxyParameters = {
  count: 100000,
  arms: 6,
  radius: 100,
  spin: 0.5,
  randomness: 0.2,
  randomnessPower: 20,
  insideColor: new THREE.Color(0xd63ed6),
  outsideColor: new THREE.Color(0x48b8b8)
};

const numGroups = heartImages.length;
const photoMode = heartImages.some(Boolean);
const photoGroups = [];
let photoReveal = 0, photoRevealTarget = 0, photosRevealed = false;
const photoSmall = Math.min(window.innerWidth, window.innerHeight) < 700;
const photoPerGroup = photoSmall ? 40 : 70;
const photoSize = photoSmall ? 10 : 11;

const maxDensity = 50000;
const minDensity = 2000;
const maxGroupsForScale = 14;
let pointsPerGroup;
if (numGroups <= 1) {
  pointsPerGroup = maxDensity;
} else if (numGroups >= maxGroupsForScale) {
  pointsPerGroup = minDensity;
} else {
  const t = (numGroups - 1) / (maxGroupsForScale - 1);
  pointsPerGroup = Math.floor(maxDensity * (1 - t) + minDensity * t);
}
if (pointsPerGroup * numGroups > galaxyParameters.count) {
  pointsPerGroup = Math.floor(galaxyParameters.count / numGroups);
}

const positions = new Float32Array(galaxyParameters.count * 3);
const colors = new Float32Array(galaxyParameters.count * 3);
let pointIdx = 0;
for (let i = 0; i < galaxyParameters.count; i++) {
  const radius = Math.pow(Math.random(), galaxyParameters.randomnessPower) * galaxyParameters.radius;
  if (radius < 30 && Math.random() < 0.8) continue;

  const branchAngle = (i % galaxyParameters.arms) / galaxyParameters.arms * Math.PI * 2;
  const spinAngle = radius * galaxyParameters.spin;
  const randomX = (Math.random() - 0.5) * galaxyParameters.randomness * radius;
  const randomY = (Math.random() - 0.5) * galaxyParameters.randomness * radius * 1.2;
  const randomZ = (Math.random() - 0.5) * galaxyParameters.randomness * radius;
  const totalAngle = branchAngle + spinAngle;

  const i3 = pointIdx * 3;
  positions[i3] = Math.cos(totalAngle) * radius + randomX;
  positions[i3 + 1] = randomY;
  positions[i3 + 2] = Math.sin(totalAngle) * radius + randomZ;

  const mixedColor = new THREE.Color(0xff66ff);
  mixedColor.lerp(new THREE.Color(0x66ffff), radius / galaxyParameters.radius);
  mixedColor.multiplyScalar(0.7 + 0.3 * Math.random());
  colors[i3] = mixedColor.r;
  colors[i3 + 1] = mixedColor.g;
  colors[i3 + 2] = mixedColor.b;
  pointIdx++;
}

const galaxyGeometry = new THREE.BufferGeometry();
galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(positions.slice(0, pointIdx * 3), 3));
galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(colors.slice(0, pointIdx * 3), 3));

const galaxyMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uSize: { value: 100.0 * renderer.getPixelRatio() },
    uOpacity: { value: 0.1 }
  },
  vertexShader: `
    uniform float uSize;
    varying vec3 vColor;
    void main() {
      vColor = color;
      vec4 viewPosition = viewMatrix * modelMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * viewPosition;
      gl_PointSize = uSize / -viewPosition.z;
    }
  `,
  fragmentShader: `
    uniform float uOpacity;
    varying vec3 vColor;
    void main() {
      float dist = length(gl_PointCoord - vec2(0.5));
      if (dist > 0.5) discard;
      gl_FragColor = vec4(vColor * uOpacity, 1.0);
    }
  `,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true,
  vertexColors: true
});
const galaxy = new THREE.Points(galaxyGeometry, galaxyMaterial);
scene.add(galaxy);

// =====================================================================
// ---- CÁC NHÓM ĐIỂM ẢNH ----
// =====================================================================
function createNeonTexture(image, size) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const aspectRatio = image.width / image.height;
  let drawWidth, drawHeight, offsetX, offsetY;
  if (aspectRatio > 1) {
    drawWidth = size;
    drawHeight = size / aspectRatio;
    offsetX = 0;
    offsetY = (size - drawHeight) / 2;
  } else {
    drawHeight = size;
    drawWidth = size * aspectRatio;
    offsetX = (size - drawWidth) / 2;
    offsetY = 0;
  }
  const r = size * 0.1;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(offsetX + r, offsetY);
  ctx.lineTo(offsetX + drawWidth - r, offsetY);
  ctx.arcTo(offsetX + drawWidth, offsetY, offsetX + drawWidth, offsetY + r, r);
  ctx.lineTo(offsetX + drawWidth, offsetY + drawHeight - r);
  ctx.arcTo(offsetX + drawWidth, offsetY + drawHeight, offsetX + drawWidth - r, offsetY + drawHeight, r);
  ctx.lineTo(offsetX + r, offsetY + drawHeight);
  ctx.arcTo(offsetX, offsetY + drawHeight, offsetX, offsetY + drawHeight - r, r);
  ctx.lineTo(offsetX, offsetY + r);
  ctx.arcTo(offsetX, offsetY, offsetX + r, offsetY, r);
  ctx.closePath();
  ctx.clip();
  ctx.drawImage(image, offsetX, offsetY, drawWidth, drawHeight);
  ctx.restore();
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createHeartTexture(size = 256) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const s = size;
  const grad = ctx.createRadialGradient(s * 0.4, s * 0.35, s * 0.05, s / 2, s / 2, s * 0.5);
  grad.addColorStop(0, '#ffd6ec');
  grad.addColorStop(0.6, '#ff69b4');
  grad.addColorStop(1, '#d6246e');
  ctx.beginPath();
  ctx.moveTo(s / 2, s * 0.88);
  ctx.bezierCurveTo(s * 0.02, s * 0.55, s * 0.1, s * 0.08, s / 2, s * 0.3);
  ctx.bezierCurveTo(s * 0.9, s * 0.08, s * 0.98, s * 0.55, s / 2, s * 0.88);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.stroke();
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function loadHeartTexture(src, callback) {
  if (!src) { callback(createHeartTexture()); return; }
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try { callback(createNeonTexture(img, 256)); }
    catch (e) { callback(createHeartTexture()); }
  };
  img.onerror = () => callback(createHeartTexture());
  img.src = src;
}

const heartObjects = [];

for (let group = 0; group < numGroups; group++) {
  const nPts = photoMode ? photoPerGroup : pointsPerGroup;
  const gPos = new Float32Array(nPts * 3);
  const gColNear = new Float32Array(nPts * 3);
  const gColFar = new Float32Array(nPts * 3);
  let valid = 0;

  for (let i = 0; i < nPts; i++) {
    const radius = photoMode
      ? 32 + Math.pow(Math.random(), 1.1) * 62
      : Math.pow(Math.random(), galaxyParameters.randomnessPower) * galaxyParameters.radius;
    if (radius < 30) continue;

    const globalIdx = group * nPts + i;
    const branchAngle = (globalIdx % galaxyParameters.arms) / galaxyParameters.arms * Math.PI * 2;
    const spinAngle = radius * galaxyParameters.spin;
    const randomX = (Math.random() - 0.5) * galaxyParameters.randomness * radius;
    const randomY = (Math.random() - 0.5) * galaxyParameters.randomness * radius * 0.5;
    const randomZ = (Math.random() - 0.5) * galaxyParameters.randomness * radius;
    const totalAngle = branchAngle + spinAngle;

    const idx = valid * 3;
    gPos[idx] = Math.cos(totalAngle) * radius + randomX;
    gPos[idx + 1] = randomY;
    gPos[idx + 2] = Math.sin(totalAngle) * radius + randomZ;

    gColNear[idx] = gColNear[idx + 1] = gColNear[idx + 2] = 1;

    const colorFar = galaxyParameters.insideColor.clone();
    colorFar.lerp(galaxyParameters.outsideColor, radius / galaxyParameters.radius);
    colorFar.multiplyScalar(0.7 + 0.3 * Math.random());
    gColFar[idx] = colorFar.r;
    gColFar[idx + 1] = colorFar.g;
    gColFar[idx + 2] = colorFar.b;
    valid++;
  }
  if (valid === 0) continue;

  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < valid; i++) {
    cx += gPos[i * 3]; cy += gPos[i * 3 + 1]; cz += gPos[i * 3 + 2];
  }
  cx /= valid; cy /= valid; cz /= valid;

  const geometryNear = new THREE.BufferGeometry();
  geometryNear.setAttribute('position', new THREE.BufferAttribute(gPos.slice(0, valid * 3), 3));
  geometryNear.setAttribute('color', new THREE.BufferAttribute(gColNear.slice(0, valid * 3), 3));
  const geometryFar = new THREE.BufferGeometry();
  geometryFar.setAttribute('position', new THREE.BufferAttribute(gPos.slice(0, valid * 3), 3));
  geometryFar.setAttribute('color', new THREE.BufferAttribute(gColFar.slice(0, valid * 3), 3));
  geometryNear.translate(-cx, -cy, -cz);
  geometryFar.translate(-cx, -cy, -cz);

  loadHeartTexture(heartImages[group], texture => {
    if (photoMode) {
      const mat = new THREE.PointsMaterial({
        size: photoSize, map: texture, transparent: true, opacity: 0,
        alphaTest: 0.12, depthWrite: false, vertexColors: true, blending: THREE.NormalBlending
      });
      const pts = new THREE.Points(geometryNear, mat);
      pts.position.set(cx, cy, cz);
      pts.renderOrder = 5;
      pts.visible = false;
      scene.add(pts);
      photoGroups.push({ mat, pts });
      return;
    }
    const materialNear = new THREE.PointsMaterial({
      size: 1.8, map: texture, transparent: true, opacity: fadeOpacity,
      alphaTest: 0.2, depthWrite: true, depthTest: true,
      blending: THREE.NormalBlending, vertexColors: true
    });
    const materialFar = new THREE.PointsMaterial({
      size: 1.8, map: texture, transparent: true, opacity: fadeOpacity,
      alphaTest: 0.2, depthWrite: false,
      blending: THREE.AdditiveBlending, vertexColors: true
    });

    const obj = new THREE.Points(geometryFar, materialFar);
    obj.position.set(cx, cy, cz);
    obj.userData = { materialNear, materialFar, geometryNear, geometryFar,
                     posArray: geometryFar.getAttribute('position').array };
    scene.add(obj);
    heartObjects.push(obj);
  });
}

function updateHeartLOD() {
  const px = camera.position.x, py = camera.position.y, pz = camera.position.z;
  for (const obj of heartObjects) {
    const arr = obj.userData.posArray;
    const ox = obj.position.x - px, oy = obj.position.y - py, oz = obj.position.z - pz;
    let isClose = false;
    for (let i = 0; i < arr.length; i += 3) {
      const dx = arr[i] + ox, dy = arr[i + 1] + oy, dz = arr[i + 2] + oz;
      if (dx * dx + dy * dy + dz * dz < 100) { isClose = true; break; }
    }
    const wantMat = isClose ? obj.userData.materialNear : obj.userData.materialFar;
    if (obj.material !== wantMat) {
      obj.material = wantMat;
      obj.geometry = isClose ? obj.userData.geometryNear : obj.userData.geometryFar;
    }
  }
}

// =====================================================================
// ---- ÁNH SÁNG, NỀN SAO ----
// =====================================================================
scene.add(new THREE.AmbientLight(0xffffff, 0.2));

const starCount = 20000;
const starGeometry = new THREE.BufferGeometry();
const starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) {
  starPositions[i] = (Math.random() - 0.5) * 900;
}
starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMaterial = new THREE.PointsMaterial({
  color: 0xffffff, size: 0.7, transparent: true, opacity: 1, depthWrite: false
});
const starField = new THREE.Points(starGeometry, starMaterial);
starField.name = 'starfield';
starField.renderOrder = 999;
scene.add(starField);
starGeometry.setDrawRange(0, Math.floor(starCount * 0.1));

// =====================================================================
// ---- HÀNH TINH TRUNG TÂM ----
// =====================================================================
function createPlanetTexture(size = 512) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gradient.addColorStop(0, '#ffd1ec');
  gradient.addColorStop(0.4, '#ff59b3');
  gradient.addColorStop(0.8, '#8a0050');
  gradient.addColorStop(1, '#1a0010');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}

const planetGeo = new THREE.SphereGeometry(6, 32, 32);
const planetMat = new THREE.MeshStandardMaterial({
  map: createPlanetTexture(),
  roughness: 0.4,
  metalness: 0.2,
  emissive: 0x550022,
  emissiveIntensity: 0.4
});
const planetMesh = new THREE.Mesh(planetGeo, planetMat);
scene.add(planetMesh);

const planetLight = new THREE.PointLight(0xff77cc, 3, 100);
planetLight.position.set(0, 0, 0);
scene.add(planetLight);

// =====================================================================
// ---- VÒNG CHỮ QUAY QUANH HÀNH TINH ----
// =====================================================================
const textCanvas = document.createElement('canvas');
textCanvas.width = 2048;
textCanvas.height = 128;
const textCtx = textCanvas.getContext('2d');
textCtx.fillStyle = 'rgba(0,0,0,0)';
textCtx.fillRect(0, 0, textCanvas.width, textCanvas.height);
textCtx.font = 'bold 50px Arial';
textCtx.fillStyle = '#ffb3de';
textCtx.textAlign = 'center';
textCtx.textBaseline = 'middle';
textCtx.shadowColor = '#ff69b4';
textCtx.shadowBlur = 20;

const fullTextString = ringTexts.join('   •   ') + '   •   ';
textCtx.fillText(fullTextString, textCanvas.width / 2, textCanvas.height / 2);

const textTexture = new THREE.CanvasTexture(textCanvas);
textTexture.wrapS = THREE.RepeatWrapping;
textTexture.wrapT = THREE.RepeatWrapping;
textTexture.repeat.set(2, 1);
textTexture.colorSpace = THREE.SRGBColorSpace;

const ringGeo = new THREE.CylinderGeometry(9, 9, 3, 64, 1, true);
const ringMat = new THREE.MeshBasicMaterial({
  map: textTexture,
  transparent: true,
  side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const ringMesh = new THREE.Mesh(ringGeo, ringMat);
ringMesh.rotation.x = Math.PI / 12;
scene.add(ringMesh);

// =====================================================================
// ---- HIỆU ỨNG SAO BĂNG / ĐIỀU ƯỚC ----
// =====================================================================
const shootingStars = [];
function createShootingStar(customText = null) {
  const geom = new THREE.BufferGeometry();
  const positions = new Float32Array(6);
  positions[0] = (Math.random() - 0.5) * 300;
  positions[1] = 150 + Math.random() * 50;
  positions[2] = (Math.random() - 0.5) * 300;
  positions[3] = positions[0] - 80;
  positions[4] = positions[1] - 80;
  positions[5] = positions[2] - 80;
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const mat = new THREE.LineBasicMaterial({
    color: customText ? 0xff69b4 : 0xffffff,
    transparent: true,
    opacity: 1,
    blending: THREE.AdditiveBlending
  });
  const line = new THREE.Line(geom, mat);
  scene.add(line);
  shootingStars.push({
    mesh: line,
    vel: new THREE.Vector3(-1.5 - Math.random(), -1.5 - Math.random(), -1.5 - Math.random()),
    life: 1.0,
    text: customText
  });

  if (customText) showFloatingWish(customText);
}

function showFloatingWish(text) {
  const div = document.createElement('div');
  div.style.position = 'fixed';
  div.style.left = '50%';
  div.style.bottom = '20%';
  div.style.transform = 'translateX(-50%)';
  div.style.padding = '10px 20px';
  div.style.background = 'rgba(40, 8, 30, 0.8)';
  div.style.border = '1px solid rgba(255, 105, 180, 0.6)';
  div.style.borderRadius = '999px';
  div.style.color = '#ffd6f0';
  div.style.font = '600 15px "Be Vietnam Pro", Arial, sans-serif';
  div.style.boxShadow = '0 0 20px rgba(255,105,180,0.5)';
  div.style.zIndex = '40';
  div.style.transition = 'all 3s ease';
  div.innerText = '✦ ' + text + ' ✦';
  document.body.appendChild(div);

  setTimeout(() => {
    div.style.transform = 'translateX(-50%) translateY(-80px)';
    div.style.opacity = '0';
  }, 100);
  setTimeout(() => div.remove(), 3100);
}

// =====================================================================
// ---- QUẢN LÝ UI & TƯƠNG TÁC ----
// =====================================================================
const tapBtn = document.getElementById('tap-btn');
const wishBtn = document.getElementById('wish-btn');
const wishPanel = document.getElementById('wish-panel');
const wishInput = document.getElementById('wish-input');
const wishClose = document.getElementById('wish-close');
const wishSend = document.getElementById('wish-send');
const letterIcon = document.getElementById('letter-icon');
const letterStage = document.getElementById('letter-stage');
const letterX = document.getElementById('letter-x');
const env = document.getElementById('env');
const letterPaper = document.getElementById('letter-paper');

let introState = 0; // 0: chờ chạm, 1: đang bay vào, 2: hoàn tất
let audioEl = null;

if (CONFIG.music) {
  audioEl = new Audio(CONFIG.music);
  audioEl.loop = true;
}

setTimeout(() => {
  if (introState === 0) tapBtn.classList.add('show');
}, 1500);

tapBtn.addEventListener('click', () => {
  if (introState !== 0) return;
  introState = 1;
  document.body.classList.add('intro-started');
  tapBtn.classList.remove('show');

  if (audioEl) audioEl.play().catch(e => console.log(e));

  // Hiệu ứng chuyển camera từ xa vào gần hành tinh
  let startPos = camera.position.clone();
  let targetPos = new THREE.Vector3(0, 5, 20);
  let startTime = performance.now();
  let duration = 3000;

  function animateIntro(now) {
    let progress = (now - startTime) / duration;
    if (progress > 1) progress = 1;
    let ease = 1 - Math.pow(1 - progress, 3);
    camera.position.lerpVectors(startPos, targetPos, ease);
    camera.lookAt(0, 0, 0);

    if (progress < 1) {
      requestAnimationFrame(animateIntro);
    } else {
      introState = 2;
      controls.enabled = true;
      wishBtn.classList.add('show');
      letterIcon.classList.add('show');
    }
  }
  requestAnimationFrame(animateIntro);
});

// Hộp điều ước
wishBtn.addEventListener('click', () => wishPanel.classList.add('open'));
wishClose.addEventListener('click', () => wishPanel.classList.remove('open'));
wishSend.addEventListener('click', () => {
  const val = wishInput.value.trim();
  if (val) {
    createShootingStar(val);
    wishInput.value = '';
    wishPanel.classList.remove('open');
  }
});

// Thư điện ảnh
let letterOpened = false;
letterIcon.addEventListener('click', () => {
  letterStage.classList.add('on');
  setTimeout(() => {
    env.classList.add('rise');
  }, 300);
  setTimeout(() => {
    env.classList.add('open');
  }, 1200);
  setTimeout(() => {
    letterPaper.classList.add('show');
    if (!letterOpened) {
      letterOpened = true;
      renderLetterText();
    }
  }, 2200);
});

letterX.addEventListener('click', () => {
  letterPaper.classList.remove('show');
  env.classList.remove('open');
  env.classList.add('away');
  setTimeout(() => {
    letterStage.classList.remove('on');
    env.classList.remove('rise', 'away');
  }, 1000);
});

function renderLetterText() {
  const lData = CONFIG.letter;
  let html = `<div class="lt-title">${lData.title}</div><div class="lt-orn">♦ ✦ ♦</div><p class="lt-p">`;
  const lines = lData.text.split('\n');
  lines.forEach(line => {
    if (line.trim() === '') {
      html += `</p><div class="lt-gap"></div><p class="lt-p">`;
    } else {
      const words = line.split(' ');
      words.forEach(w => {
        html += `<span class="lt-w">${w}</span> `;
      });
      html += `<br>`;
    }
  });
  html += `</p><div class="lt-sign">— Nam</div><button id="letter-done" type="button">Khám phá thiên hà ✨</button>`;
  letterPaper.innerHTML = html;

  const spans = letterPaper.querySelectorAll('.lt-w');
  spans.forEach((sp, idx) => {
    setTimeout(() => sp.classList.add('in'), 120 + idx * 45);
  });

  setTimeout(() => {
    const doneBtn = document.getElementById('letter-done');
    if (doneBtn) {
      doneBtn.classList.add('in');
      doneBtn.onclick = () => {
        letterX.click();
        // Kích hoạt hiển thị ảnh/tinh vân khi đọc xong thư
        photosRevealed = true;
        photoRevealTarget = 1;
      };
    }
  }, 1200 + spans.length * 45);
}

// =====================================================================
// ---- VÒNG LẶP RENDER CHÍNH ----
// =====================================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const time = clock.getElapsedTime();

  // Quay vòng chữ và hành tinh
  ringMesh.rotation.z += 0.002;
  planetMesh.rotation.y += 0.001;
  textTexture.offset.x -= 0.001;

  // Xử lý sao băng ngẫu nhiên
  if (Math.random() < 0.02) createShootingStar();
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    let s = shootingStars[i];
    s.mesh.position.add(s.vel);
    s.life -= delta * 0.8;
    s.mesh.material.opacity = s.life;
    if (s.life <= 0) {
      scene.remove(s.mesh);
      shootingStars.splice(i, 1);
    }
  }

  // Hiệu ứng hiện ảnh sau khi xem thư
  if (photosRevealed && photoReveal < photoRevealTarget) {
    photoReveal += delta * 0.4;
    if (photoReveal > 1) photoReveal = 1;
    photoGroups.forEach((g, idx) => {
      g.pts.visible = true;
      g.mat.opacity = photoReveal * 0.85;
      const s = 0.5 + photoReveal * 0.5;
      g.pts.scale.set(s, s, s);
    });
  }

  controls.update();
  updateHeartLOD();
  renderer.render(scene, camera);
}

// Xử lý thay đổi kích thước màn hình
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
